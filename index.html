<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div id="theme-toggle-container">
            <button id="theme-toggle">🌓 Toggle Theme</button>
        </div>

        <section id="partnership-contact">
            <h2>제휴 문의</h2>
            <p>비즈니스 제휴 및 협력 제안을 기다립니다.</p>
            <form action="https://formspree.io/f/xojbjljl" method="POST">
                <div class="form-group">
                    <label for="name">이름/기업명</label>
                    <input type="text" id="name" name="name" required placeholder="홍길동">
                </div>
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="subject">문의 유형</label>
                    <select id="subject" name="subject">
                        <option value="partnership">비즈니스 제휴</option>
                        <option value="marketing">마케팅/광고</option>
                        <option value="technical">기술 협력</option>
                        <option value="other">기타</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="5" required placeholder="내용을 입력해주세요."></textarea>
                </div>
                <button type="submit" id="submit-button">문의하기</button>
            </form>
        </section>
    </div>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
